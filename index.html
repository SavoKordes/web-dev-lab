<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web Dev Lab</title>
  <meta name="description" content="A structured training program for reading, writing and debugging HTML, CSS and JavaScript.">

  <!--
    theme-init.js is a classic (non-module) script on purpose: it runs immediately,
    before the page is drawn, so a saved dark theme never "flashes" white first.
    Everything else is loaded as an ES module from js/main.js.
  -->
  <script src="js/theme-init.js"></script>

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/syntax.css">
  <link rel="stylesheet" href="css/editor.css">
  <link rel="stylesheet" href="css/exercise.css">
  <link rel="stylesheet" href="css/learn.css">
  <link rel="stylesheet" href="css/progress.css">

  <!-- type="module" scripts are deferred automatically: they run after the HTML is parsed. -->
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <!-- Icon sprite: each <symbol> is drawn once and reused with <svg><use href="#i-name"></use></svg>. -->
  <svg class="sprite" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-dashboard" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></symbol>
    <symbol id="i-curriculum" viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/><path d="M8 7h8M8 11h6"/></symbol>
    <symbol id="i-progress" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 6-7"/></symbol>
    <symbol id="i-learn" viewBox="0 0 24 24"><path d="M2 5h7a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H2z"/><path d="M22 5h-7a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h8z"/></symbol>
    <symbol id="i-code" viewBox="0 0 24 24"><path d="m8 7-5 5 5 5"/><path d="m16 7 5 5-5 5"/><path d="m14 4-4 16"/></symbol>
    <symbol id="i-debug" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="13" rx="5"/><path d="M9 7a3 3 0 0 1 6 0M12 11v9M3 13h4M17 13h4M4 7l3 2M20 7l-3 2M4 19l3-2M20 19l-3-2"/></symbol>
    <symbol id="i-understand" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-projects" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></symbol>
    <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 21V9M7 14l5-5 5 5M4 3h16"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol>
  </svg>

  <a class="skip-link" href="#main">Skip to content</a>

  <div class="app" id="app">
    <!-- ───────── Sidebar navigation ───────── -->
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <div class="sidebar__brand">
        <span class="brand-mark" aria-hidden="true">&lt;/&gt;</span>
        <span class="brand-name">Web Dev Lab</span>
        <button class="icon-btn sidebar__close" type="button" data-action="close-nav" aria-label="Close navigation">
          <svg class="icon"><use href="#i-close"></use></svg>
        </button>
      </div>

      <nav class="sidebar__nav">
        <p class="nav-group-label">Overview</p>
        <ul class="nav-list">
          <li><a class="nav-link" href="#/" data-section="dashboard"><svg class="icon"><use href="#i-dashboard"></use></svg>Dashboard</a></li>
          <li><a class="nav-link" href="#/curriculum" data-section="curriculum"><svg class="icon"><use href="#i-curriculum"></use></svg>Curriculum</a></li>
          <li><a class="nav-link" href="#/progress" data-section="progress"><svg class="icon"><use href="#i-progress"></use></svg>Progress</a></li>
        </ul>

        <p class="nav-group-label">Practice modes</p>
        <ul class="nav-list">
          <li><a class="nav-link" href="#/learn" data-section="learn"><svg class="icon"><use href="#i-learn"></use></svg>Learn</a></li>
          <li><a class="nav-link" href="#/code" data-section="code"><svg class="icon"><use href="#i-code"></use></svg>Code</a></li>
          <li><a class="nav-link" href="#/debug" data-section="debug"><svg class="icon"><use href="#i-debug"></use></svg>Debug</a></li>
          <li><a class="nav-link" href="#/understand" data-section="understand"><svg class="icon"><use href="#i-understand"></use></svg>Understand</a></li>
        </ul>

        <p class="nav-group-label">Apply</p>
        <ul class="nav-list">
          <li><a class="nav-link" href="#/projects" data-section="projects"><svg class="icon"><use href="#i-projects"></use></svg>Projects</a></li>
        </ul>
      </nav>

      <div class="sidebar__footer">
        <a class="nav-link" href="#/settings" data-section="settings"><svg class="icon"><use href="#i-settings"></use></svg>Settings</a>
      </div>
    </aside>

    <!-- Dark overlay behind the sidebar on small screens. Clicking it closes the menu. -->
    <div class="sidebar-backdrop" data-action="close-nav"></div>

    <!-- ───────── Main column ───────── -->
    <div class="main-col">
      <header class="topbar">
        <button class="icon-btn nav-toggle" type="button" data-action="open-nav"
                aria-controls="sidebar" aria-expanded="false" aria-label="Open navigation">
          <svg class="icon"><use href="#i-menu"></use></svg>
        </button>
        <p class="topbar__title" id="topbar-title">Web Dev Lab</p>
        <div class="topbar__actions">
          <button class="icon-btn" type="button" id="theme-toggle" aria-label="Switch theme">
            <svg class="icon theme-icon--light"><use href="#i-moon"></use></svg>
            <svg class="icon theme-icon--dark"><use href="#i-sun"></use></svg>
          </button>
        </div>
      </header>

      <!-- Every view is rendered inside <main>. tabindex="-1" lets us move focus here after navigation. -->
      <main class="main" id="main" tabindex="-1">
        <noscript><p class="main__noscript">This application needs JavaScript enabled.</p></noscript>
      </main>
    </div>
  </div>
</body>
</html>
